<style>:root{
  --bg:#08080f;
  --panel:#101019;
  --panel2:#151524;
  --ink:#f5f3ff;
  --dim:#a09abf;
  --faint:#6b6584;
  --violet:#a78bfa;
  --violet-deep:#7c3aed;
  --cyan:#22d3ee;
  --green:#4ade80;
  --red:#fb7185;
  --yellow:#facc15;
  --line:rgba(167,139,250,.14);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 90% 55% at 50% -12%, rgba(139,92,246,.13), transparent);
  color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:17px;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
a{color:var(--violet);text-decoration:none}
a:hover{color:#c4b5fd}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* header */
header.site{padding:20px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:19px;letter-spacing:.14em}
.brand .mark{color:var(--violet);margin-right:8px}
.brand .amber{color:var(--violet)}
.tagline{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--faint);margin-top:6px}
nav.main{margin-top:14px;display:flex;gap:26px;font-size:13px;font-weight:700;letter-spacing:.1em}
nav.main a{color:var(--dim);padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
nav.main a:hover{color:var(--ink)}
nav.main a.on{color:var(--violet);border-bottom-color:var(--violet)}

/* hero */
.hero{padding:66px 0 46px}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--violet);background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.32);padding:8px 18px;border-radius:999px;margin-bottom:26px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
h1{font-size:clamp(36px,6.5vw,62px);line-height:1.06;font-weight:800;letter-spacing:-.025em}
h1 .grad{background:linear-gradient(115deg,var(--violet) 10%,var(--cyan) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .soft{color:var(--dim);font-weight:700}
.lede{font-size:19px;color:var(--dim);max-width:640px;margin-top:18px}
.stats{display:flex;gap:12px;margin-top:36px}
.stats div{flex:1;background:linear-gradient(180deg,var(--panel),transparent);border:1px solid var(--line);border-radius:18px;padding:18px 22px}
.stats b{font-size:30px;font-weight:800;letter-spacing:-.02em;display:block}
.stats b em{font-style:normal;background:linear-gradient(115deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:10.5px;letter-spacing:.2em;color:var(--faint);font-family:var(--mono)}

/* sections + cards */
h2.sec{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.26em;color:var(--faint);margin:54px 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:block;background:linear-gradient(180deg,var(--panel) 0%,rgba(16,16,25,0) 130%);border:1px solid var(--line);border-radius:20px;padding:26px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.5);box-shadow:0 16px 44px -14px rgba(139,92,246,.4)}
.card .code{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--violet)}
.card h3{font-size:21px;margin:12px 0 8px;font-weight:750;letter-spacing:-.015em;color:var(--ink)}
.card p{font-size:15px;color:var(--dim)}
.card .n{font-family:var(--mono);font-size:12px;color:var(--cyan);margin-top:16px;display:block;letter-spacing:.12em}

/* badges — soft pills */
.badge{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;padding:6px 14px;border-radius:999px;margin-bottom:12px;border:1px solid transparent}
.st-verified{color:var(--green);background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.32)}
.st-disputed{color:var(--red);background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.32)}
.st-unproven{color:var(--yellow);background:rgba(250,204,21,.1);border-color:rgba(250,204,21,.32)}

/* file list */
.fileitem{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:12px;transition:border-color .15s,transform .15s}
.fileitem:hover{border-color:rgba(139,92,246,.45);transform:translateX(3px)}
.fileitem h3{font-size:19px;font-weight:700;margin:10px 0;letter-spacing:-.01em}
.fileitem h3 a{color:var(--ink)}
.fileitem h3 a:hover{color:var(--violet)}
.fileitem .meta{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.08em}
.fileitem .meta a{color:var(--dim)}
.fileitem p{font-size:15px;color:var(--dim);margin-top:8px}

/* record page */
.sources{margin-top:32px;border-top:1px solid var(--line);padding-top:22px}
.sources li{list-style:none;margin:10px 0;font-family:var(--mono);font-size:14px}
.sources li::before{content:"\2726  ";color:var(--violet)}
.key{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;margin-top:20px}
.key p{font-size:15px;color:var(--dim);margin:10px 0}
footer.site{border-top:1px solid var(--line);margin-top:72px;padding:32px 0 48px;font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.1em}
footer.site .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.redact{background:var(--dim);color:transparent;user-select:none;padding:0 8px;border-radius:6px}
.searchbox{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--ink);font-family:var(--sans);font-size:17px;padding:16px 22px;margin-top:24px;outline:none;transition:border-color .15s,box-shadow .15s}
.searchbox:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
.searchbox::placeholder{color:var(--faint)}
#results .fileitem{cursor:pointer}
.card p,.card h3,.fileitem p,.fileitem h3,.sources li,.lede{overflow-wrap:break-word;word-break:break-word}
@media(max-width:640px){
  .stats{flex-direction:column}
  nav.main{gap:16px;flex-wrap:wrap}
  .hero{padding:46px 0 34px}
  .card{padding:22px}
}

const IDX=[{"id": "28-pages", "title": "The Declassified '28 Pages' on Saudi Links", "topic": "9/11: The Documents", "tid": "sept11", "summary": "Part IV of the 2002 Joint Inquiry into pre-9/11 intelligence, redacted at the Bush administration's insistence and released after a 13-year bipartisan push. Summarizes investigative LEADS about Saudi officials' and suspected agents' financial/logistical support to hijackers — and reaches no conclusions. The White House, Kean/Hamilton and the 2015 9/11 Review Commission all said the pages contain no evidence of institutional Saudi government funding of al-Qaeda.", "tags": "9/11 Saudi Arabia declassified", "status": "verified", "date": "2016-07-15"}, {"id": "911-commission-report", "title": "The 9/11 Commission Report", "topic": "9/11: The Documents", "tid": "sept11", "summary": "Final report of the bipartisan National Commission on Terrorist Attacks Upon the United States. Establishes that 19 al-Qaeda hijackers carried out the attacks and catalogues institutional failures (FBI–CIA info sharing, watchlisting, FAA/NORAD response, the August 6 2001 PDB). On insider trading it is explicit: exhaustive SEC/FBI investigations 'uncovered no evidence that anyone with advance knowledge of the attacks profited through securities transactions.' Commission chairs Kean and Hamilton later charged the CIA obstructed the Commission.", "tags": "9/11 commission insider trading", "status": "verified", "date": "2004-07-22"}, {"id": "adrenochrome-origins", "title": "Adrenochrome: From Fiction to QAnon", "topic": "Satanic Panic & Adrenochrome", "tid": "satanic-panic", "summary": "Origin chain of the elite baby-eating/adrenochrome claim: Hunter S. Thompson's 1971 FICTION 'Fear and Loathing in Las Vegas' → Gilliam's 1998 film → 4chan /x/ (2013) and /pol/ (2014) → Pizzagate (2016) → QAnon (2017+). Scientific reality: adrenochrome is a real chemical (oxidized adrenaline) — unstable, no fountain-of-youth properties, synthesized industrially. NO primary source — no court filing, FBI file, testimony or DOJ release — connects Epstein or any public figure to adrenochrome harvesting or ritual sacrifice.", "tags": "adrenochrome QAnon", "status": "verified", "date": "1971-01-01"}, {"id": "benghazi-report", "title": "House Benghazi Committee Report (2016)", "topic": "The Clinton Files", "tid": "clinton", "summary": "~800 pages on the Sept 11, 2012 attack that killed Ambassador Stevens and three others: State failed to protect diplomats; CIA misread Libya's danger; DOD assets never reached Benghazi in time. Also found: NO new evidence of culpability by Clinton; NO 'stand down' order was issued; US forces in Europe could not have arrived in time.", "tags": "Clinton Benghazi", "status": "verified", "date": "2016-06-28"}, {"id": "bilderberg", "title": "Bilderberg Meetings: What Is Documented", "topic": "Bohemian Grove & Bilderberg", "tid": "grove", "summary": "Annual invitation-only conference (~120–150 politicians, CEOs, central bankers, academics) under the Chatham House Rule since 1954. The organization itself publishes each year's agenda and participant list (2024 Madrid: 131 participants; 2025 Stockholm: 121). No primary source — minutes, directives, testimony — shows decision-making authority or a secret world government.", "tags": "Bilderberg elites", "status": "verified", "date": "1954-05-01"}, {"id": "bohemian-grove", "title": "Bohemian Grove: What Is Documented", "topic": "Bohemian Grove & Bilderberg", "tid": "grove", "summary": "The Bohemian Club (est. 1872) holds an annual all-male summer encampment at Monte Rio, CA; the opening 'Cremation of Care' is a theatrical pageant (filmed by infiltrators in 2000). Nixon's engagement with the Grove is documented in White House tape logs — his 1967 speech there and a proposed-then-cancelled 1971 presidential visit (Nixon Library subject logs). On a May 13, 1971 tape, Nixon is widely reported to have called it 'the most faggy goddamned thing you could ever imagine... I attend from time to time.' No primary-source evidence supports claims of satanic rituals or human sacrifice; no criminal case has ever been tied to the Grove.", "tags": "Bohemian Grove Nixon", "status": "verified", "date": "1971-05-13"}, {"id": "church-committee", "title": "Church Committee Final Report (1976)", "topic": "The Deep State, On the Record", "tid": "intel-abuses", "summary": "Senate Select Committee on Intelligence Activities: 126 meetings, ~800 witnesses, 110,000 documents. Found 'intelligence excesses, at home and abroad' spanning FDR to the early 1970s — CIA assassination plots (e.g. Castro), COINTELPRO, NSA SHAMROCK/MINARET monitoring Americans. Led to permanent intelligence committees and FISA (1978).", "tags": "deep state CIA FBI NSA", "status": "verified", "date": "1976-04-29"}, {"id": "cia-interrogation-report", "title": "Senate Report: CIA Detention & Interrogation (2014)", "topic": "Bush-Era Files", "tid": "bush-era", "summary": "Five-year SSCI study of 6.3M+ pages of CIA records; 500+ page declassified executive summary. Findings: 'enhanced interrogation techniques' were not effective; the CIA gave extensively inaccurate information about the program to policymakers and the public; management was deeply flawed; the program was far more brutal than represented (waterboarding, systematic beatings, sleep deprivation; 119+ detainees in secret 'black sites').", "tags": "Bush CIA torture", "status": "verified", "date": "2014-12-09"}, {"id": "claim-benghazi-standdown", "title": "CLAIM: A 'stand down' order was issued at Benghazi", "topic": "The Clinton Files", "tid": "clinton", "summary": "The House Select Committee (2016) found NO stand-down order was issued, and that US forces in Europe could not have arrived in time — consistent with all prior inquiries.", "tags": "Clinton Benghazi claim", "status": "disputed", "date": "2012-09-11"}, {"id": "claim-demolition", "title": "CLAIM: Controlled demolition of the Twin Towers / WTC 7", "topic": "9/11: The Documents", "tid": "sept11", "summary": "Popular claim that explosives or thermite brought down WTC 1, 2 and 7. Counter-evidence: NIST NCSTAR 1 & 1A document a fire-driven progressive collapse mechanism with no blast evidence; NIST's FAQ quantitatively rebuts the thermite scenario. No primary source supports demolition.", "tags": "9/11 claim", "status": "disputed", "date": "2001-09-11"}, {"id": "claim-epstein-client-list", "title": "CLAIM: A suppressed Epstein 'client list' exists", "topic": "The Epstein Files", "tid": "epstein", "summary": "Viral '166-name'/'200-name' lists conflate flight logs, the address book and deposition mentions. The July 2025 DOJ/FBI systematic review 'revealed no incriminating client list'; Maxwell told DOJ none exists. No document functioning as a client list has ever been an exhibit in any Epstein/Maxwell case. Existence: UNPROVEN.", "tags": "Epstein claim", "status": "unproven", "date": "2025-07-07"}, {"id": "claim-finders-cia", "title": "CLAIM: The Finders were a CIA child-trafficking front", "topic": "Satanic Panic & Adrenochrome", "tid": "satanic-panic", "summary": "Claims allege a CIA-front child-trafficking/satanic cult whose investigation was shut down as a 'CIA internal matter.' The 324-page FBI file shows the 1987 investigation found no evidence of criminal activity; charges were dropped; no convictions. The CIA-interference claim exists in the file only as an allegation in one Customs memo; the 1993–94 DOJ review did not substantiate it.", "tags": "Finders claim", "status": "unproven", "date": "1987-02-01"}, {"id": "claim-franklin-ring", "title": "CLAIM: Franklin was an elite satanic abuse ring reaching Washington", "topic": "Satanic Panic & Adrenochrome", "tid": "satanic-panic", "summary": "The Douglas County Grand Jury (76 witnesses, 395 exhibits) 'found no credible evidence' of child sexual abuse, interstate transport of minors, drug trafficking or a pornography ring by King or Franklin officials. Key witnesses recanted or were convicted of perjury. No abuse-ring indictments or convictions resulted; only King's financial-crimes conviction stands.", "tags": "Franklin claim", "status": "unproven", "date": "1990-07-23"}, {"id": "claim-grassy-knoll", "title": "CLAIM: A second gunman on the grassy knoll", "topic": "The JFK Files", "tid": "jfk", "summary": "The HSCA's 1979 'high probability of conspiracy' rested SOLELY on acoustic analysis of the Dallas police Dictabelt recording. The FBI Laboratory review (Dec 1980) found the analyses 'did not scientifically prove' a second gunman — the finding is invalid; later audio research confirmed the open-mike motorcycle wasn't in the motorcade during the shots.", "tags": "JFK claim", "status": "disputed", "date": "1963-11-22"}, {"id": "claim-insider-trading", "title": "CLAIM: 9/11 insider trading proves foreknowledge", "topic": "9/11: The Documents", "tid": "sept11", "summary": "Unusual put-option activity before 9/11 is cited as proof of foreknowledge. Counter-evidence: the 9/11 Commission reports exhaustive SEC/FBI investigations found no evidence anyone with advance knowledge profited — the 'highly suspicious' UAL puts were 95% one US institutional investor with no al-Qaeda ties; AMR trading traced to a Sept 9 options newsletter.", "tags": "9/11 claim", "status": "disputed", "date": "2001-09-11"}, {"id": "claim-mockingbird-name", "title": "CLAIM: A CIA program literally named 'Operation Mockingbird' ran the U.S. press", "topic": "The Deep State, On the Record", "tid": "intel-abuses", "summary": "The NAME 'Operation Mockingbird' first appears in Deborah Davis's 1979 Katharine Graham biography and appears in NO released CIA or congressional document. Three real things get conflated: Frank Wisner's 'Mighty Wurlitzer' foreign propaganda network; the ~50 domestic journalist relationships documented by the Church Committee; and the real 'Project Mockingbird' — a narrow 1963 warrantless wiretap of two columnists (acknowledged in the CIA 'Family Jewels,' 2007).", "tags": "Mockingbird claim", "status": "unproven", "date": "1979-01-01"}, {"id": "claim-morgan-fed", "title": "CLAIM: J.P. Morgan created the Federal Reserve", "topic": "Rothschild & Morgan", "tid": "bankers", "summary": "Morgan died March 31, 1913 — before the Federal Reserve Act (Dec 23, 1913). Bankers including Paul Warburg influenced the design (Jekyll Island, 1910), but the Fed is a creature of Congress.", "tags": "Morgan claim Federal Reserve", "status": "disputed", "date": "1913-12-23"}, {"id": "claim-rothschild-banks", "title": "CLAIM: Rothschilds own all the world's central banks", "topic": "Rothschild & Morgan", "tid": "bankers", "summary": "Viral claim that the Rothschilds secretly own the Federal Reserve and most central banks. Counter-evidence: central banks are publicly/government-owned (Bank of England nationalized 1946; the Fed 'is not owned by anyone' — created by Congress). AAP FactCheck verdict: False. The trope traces to an anonymous 1846 Paris pamphlet and 'Protocols'-era literature.", "tags": "Rothschild claim", "status": "disputed", "date": "1846-01-01"}, {"id": "claim-satanic-cult", "title": "CLAIM: Organized satanic cults abused children en masse in the 1980s", "topic": "Satanic Panic & Adrenochrome", "tid": "satanic-panic", "summary": "Dozens of daycare ritual-abuse prosecutions collapsed nationwide (McMartin: zero convictions; Keller convictions overturned, declared actually innocent 2017). The FBI's 1992 Lanning report found no evidence of large-scale organized satanic cults. Nearly all the accused were eventually freed.", "tags": "satanic panic claim", "status": "disputed", "date": "1990-01-18"}, {"id": "claim-snowden-cia-plant", "title": "CLAIM: Snowden was a CIA plant running coded ops", "topic": "Mass Surveillance Files", "tid": "surveillance", "summary": "Q-drop-era claim that the whistleblower was a CIA-planted operative. No primary source — no document, testimony or investigative file — supports it; the public record is the disclosure archive itself.", "tags": "Snowden claim", "status": "unproven", "date": "2013-06-05"}, {"id": "clinton-emails", "title": "FBI Clinton Email Investigation ('Midyear Exam')", "topic": "The Clinton Files", "tid": "clinton", "summary": "Comey's statement: Clinton was 'extremely careless' with classified info on personal servers (~110 emails in 52 chains classified at the time of sending); 'no clear evidence' of intent; 'no reasonable prosecutor' would bring charges — declined. Briefly reopened Oct 28, 2016 (Weiner laptop), closed Nov 6 with conclusions unchanged. DOJ IG (June 2018) criticized Comey's public statements but found no evidence political bias affected the declination.", "tags": "Clinton FBI emails", "status": "verified", "date": "2016-07-05"}, {"id": "clinton-foundation", "title": "Clinton Foundation: Facts vs Claims", "topic": "The Clinton Files", "tid": "clinton", "summary": "Founded 1997; a public OPERATING foundation running its own programs (HIV/AIDS, climate, health). Ratings: Charity Navigator 4/4 stars; CharityWatch 'A' (~88% to mission). Documented controversies: foreign-government donations during her State tenure; disclosure lapses. Claims: 'Only 6% goes to charity' — DISPUTED (counts grants only, ignoring program expenses ~80–89%). 'Pay-to-play proven' — UNPROVEN; multiple inquiries, no charges.", "tags": "Clinton foundation", "status": "verified", "date": "1997-01-01"}, {"id": "cointelpro", "title": "COINTELPRO: The FBI's Own Files", "topic": "The Deep State, On the Record", "tid": "intel-abuses", "summary": "FBI Counter Intelligence Program, authorized by Hoover in 1956. Declassified files show warrantless wiretapping, surreptitious entry, mail opening, paid informants, fabricated correspondence and forged documents against civil-rights, antiwar and other groups — including the 1964 anonymous letter urging MLK to kill himself. Exposed by the 1971 Media, PA office burglary; terminated April 1971. The FBI's own Vault summary concedes it was 'rightfully criticized... for abridging first amendment rights.'", "tags": "deep state FBI MLK", "status": "verified", "date": "1956-08-28"}, {"id": "eisenhower-farewell", "title": "Eisenhower's Farewell Address (1961)", "topic": "The Deep State, On the Record", "tid": "intel-abuses", "summary": "'In the councils of government, we must guard against the acquisition of unwarranted influence, whether sought or unsought, by the military-industrial complex. The potential for the disastrous rise of misplaced power exists and will persist.' He also warned policy could become 'captive of a scientific-technological elite.' He never said 'deep state' — a 21st-century term (from Turkish 'derin devlet').", "tags": "deep state military-industrial complex", "status": "verified", "date": "1961-01-17"}, {"id": "epstein-flight-logs", "title": "The Flight Logs (Court Exhibits)", "topic": "The Epstein Files", "tid": "epstein", "summary": "Pilot manifests for Epstein's aircraft entered as exhibits in Giuffre v. Maxwell, introduced at Maxwell's trial, and released via FOIA/DOJ disclosures (2,618+ known flights compiled). Names include Bill Clinton, Donald Trump, Prince Andrew, Kevin Spacey, Naomi Campbell, Chris Tucker, Alan Dershowitz, Jean-Luc Brunel, Larry Summers. They show who was on which flights — appearance establishes association, NOT wrongdoing, a distinction emphasized by DOJ, courts and fact-checkers.", "tags": "Epstein flight logs", "status": "verified", "date": "2015-12-10"}, {"id": "epstein-indictment", "title": "2019 SDNY Indictment (19 Cr. 490)", "topic": "The Epstein Files", "tid": "epstein", "summary": "United States v. Jeffrey Epstein: conspiracy to commit sex trafficking of minors (§371) and sex trafficking of minors (§1591), alleging conduct 2002–2005 in New York and Palm Beach — girls as young as 14 enticed to 'massages' escalating to sex acts for cash, victims recruited to recruit others. Epstein was found dead August 10, 2019 (suicide, per the NYC medical examiner); the criminal case abated. Guilt was never adjudicated.", "tags": "Epstein court records", "status": "verified", "date": "2019-07-08"}, {"id": "epstein-memo-2025", "title": "July 2025 DOJ/FBI Memo: No 'Client List'", "topic": "The Epstein Files", "tid": "epstein", "summary": "Unsigned two-page DOJ/FBI memo after systematic review: (1) no incriminating 'client list' found; (2) no credible evidence Epstein blackmailed prominent individuals; (3) suicide finding reaffirmed (medical examiner + 2023 DOJ OIG report); (4) no further disclosures warranted at that time. AG Bondi had said in Feb 2025 a 'client list' was 'sitting on my desk'; she walked that back July 8. No document functioning as a client list has ever been entered as an exhibit in any Epstein/Maxwell case.", "tags": "Epstein client list DOJ", "status": "verified", "date": "2025-07-07"}, {"id": "epstein-npa", "title": "The 2008 Non-Prosecution Agreement", "topic": "The Epstein Files", "tid": "epstein", "summary": "Facing a 53-page federal indictment, Epstein's team negotiated an NPA with U.S. Attorney Acosta's office. He pleaded to two Florida state charges, served ~13 months of an 18-month county-jail sentence with work release, and the NPA immunized him, four named accomplices and unnamed 'any potential co-conspirators' from federal prosecution in S.D. Florida. Victims were not informed (later found to violate the Crime Victims' Rights Act). DOJ's OPR called it 'extraordinary' and found 'poor judgment,' no impermissible considerations.", "tags": "Epstein court records", "status": "verified", "date": "2007-09-24"}, {"id": "epstein-tranches", "title": "Epstein Files: The 2025–2026 Tranches", "topic": "The Epstein Files", "tid": "epstein", "summary": "Beyond the July 2025 DOJ/FBI memo: Feb 27, 2025 — AG Bondi 'Phase 1' (~100+ pages). Sept 2025 — House Oversight posted 33,295 pages from DOJ; Nov 2025 — ~20,000 pages from Epstein's estate. Nov 19, 2025 — Epstein Files Transparency Act signed (publish all unclassified DOJ Epstein records within 30 days). Dec 19, 2025 — first EFTA tranche (heavy redactions). Jan 30, 2026 — largest tranche: ~3–3.5M pages + 2,000+ videos + 180,000 images; DAG called it the 'final major disclosure.' Contents: flight logs, financial ledgers, interview transcripts, FBI memos, Maxwell-trial materials. No new criminal charges announced.", "tags": "Epstein DOJ tranches", "status": "verified", "date": "2026-01-30"}, {"id": "epstein-vault-doj", "title": "FBI Vault & DOJ Epstein Disclosures", "topic": "The Epstein Files", "tid": "epstein", "summary": "FBI Vault collection (22 parts of investigative records); DOJ disclosure page; ~900 pages unsealed Jan 2024 from Giuffre v. Maxwell (depositions, emails, contact book). Feb 2025 'Phase 1' release was mostly already-public material. Under the Epstein Files Transparency Act, ~3.5M pages, ~2,000 videos and ~180,000 photos were released Dec 2025–Jan 2026. DOJ warned some circulating material may be fake or planted.", "tags": "Epstein FBI DOJ", "status": "verified", "date": "2024-01-01"}, {"id": "fbi-vault-911", "title": "FBI Vault: 9/11 Collections", "topic": "9/11: The Documents", "tid": "sept11", "summary": "The FBI's FOIA library hosts the 9/11 Commission Report investigative files (monthly releases 2001–2004), material released under Executive Order 14040 (2021 declassification review), and Pentagon exterior/interior/debris photos plus emergency-response footage.", "tags": "9/11 FBI FOIA", "status": "verified", "date": "2001-01-01"}, {"id": "finders-file", "title": "FBI Vault: 'The Finders' File (324 pp.)", "topic": "Satanic Panic & Adrenochrome", "tid": "satanic-panic", "summary": "324-page FBI Vault file posted Nov 2019: Tallahassee PD 1987 arrest reports (two men with six children), DC Metro PD records, a 1987 U.S. Customs memo, FBI field reports, 1993 inquiry correspondence, news clippings. The investigation found no evidence of criminal activity; charges were dropped; no convictions resulted. The CIA-interference claim exists in the file only as an allegation (Martinez memo); the 1993–94 DOJ review did not substantiate it.", "tags": "Finders FBI satanic panic", "status": "verified", "date": "2019-11-01"}, {"id": "franklin-case", "title": "Franklin Credit Union Case: Court Records vs. Claims", "topic": "Satanic Panic & Adrenochrome", "tid": "satanic-panic", "summary": "What court records establish: Lawrence E. King Jr. convicted of financial crimes (fraud/embezzlement), pleaded guilty 1991, 15-year federal sentence. Vs. the claims: an elite child-trafficking/satanic ring reaching Washington was examined by the Douglas County Grand Jury (82 days, 395 exhibits, 76 witnesses; report July 23, 1990) — 'found no credible evidence' of abuse, interstate transport of minors, drug trafficking or a pornography ring. Key witnesses recanted (Troy Boner) or were convicted of perjury (Alisha Owen, 1991). No abuse-ring indictments or convictions resulted.", "tags": "Franklin court records", "status": "verified", "date": "1990-07-23"}, {"id": "iran-contra", "title": "Iran-Contra: Tower Commission & Walsh Report", "topic": "The Deep State, On the Record", "tid": "intel-abuses", "summary": "The Reagan administration secretly sold arms to Iran and diverted proceeds to Nicaragua's Contras despite the Boland Amendment ban. Tower Commission (Feb 1987): Reagan's 'lax managerial style.' Walsh final report (Aug 1993): 14 officials charged, 11 convictions/guilty pleas; arms sales 'contravened U.S. Government policy'; systematic document destruction documented. George H.W. Bush's Dec 24, 1992 pardons ended the probe.", "tags": "deep state Reagan CIA", "status": "verified", "date": "1987-02-26"}, {"id": "jfk-2023-release", "title": "NARA JFK Releases (2023)", "topic": "The JFK Files", "tid": "jfk", "summary": "NARA posted thousands of formerly-redacted records: CIA Office of Legislative Counsel journals, JMWAVE cables, CIA Oswald files, Rockefeller Commission/HSCA-era material and  2021: four accuser witnesses testified under oath to grooming and sexual abuse as minors with Maxwell's assistance; exhibits included flight logs, the address book, photographs and financial records. Guilty on 5 of 6 counts; sentenced June 2022 to 20 years; affirmed by the Second Circuit (2024); Supreme Court declined review (Oct 2025). Note: trafficking of victims TO third parties was not proven at trial and remains alleged, not established.", "tags": "Epstein Maxwell court records", "status": "verified", "date": "2021-12-29"}, {"id": "mcmartin-trial", "title": "The McMartin Preschool Trial (1983–1990)", "topic": "Satanic Panic & Adrenochrome", "tid": "satanic-panic", "summary": "Seven years, ~$15–16M — the longest, most expensive criminal trial in US history at the time. Allegations included satanic rituals, tunnels under the school and animal sacrifice. Result: NO convictions. Peggy McMartin Buckey acquitted of all counts Jan 18, 1990; Ray Buckey acquitted on 52 of 65 counts, rest hung/dismissed. Suggestive child-interview techniques were discredited and reshaped abuse investigations nationwide.", "tags": "satanic panic McMartin", "status": "verified", "date": "1990-01-18"}, {"id": "mkultra-docs", "title": "MKUltra: The CIA's Declassified Files", "topic": "The Deep State, On the Record", "tid": "intel-abuses", "summary": "CIA Director Helms ordered MKUltra files destroyed in 1973; a 1977 FOIA request surfaced ~20,000 misfiled records. At the Aug 3, 1977 Senate hearings, DCI Stansfield Turner testified on the finds: 149 subprojects across 80+ institutions (universities, hospitals, prisons, pharma companies); unwitting dosing of American and Canadian citizens with LSD and other drugs. Program closed 1964, some work continuing as MKSEARCH.", "tags": "MKUltra CIA mind control", "status": "verified", "date": "1977-08-03"}, {"id": "mlk-files-2025", "title": "MLK Assassination Files: 230,000+ Pages (2025)", "topic": "RFK & MLK Files", "tid": "rfk-mlk", "summary": "July 21, 2025 — 230,000+ pages released per EO 14176: the FBI MURKIN (Murder-King) investigation file; responsive CIA records; the State Department file on James Earl Ray's extradition from the UK; internal FBI memos and investigative leads. Per ODNI, unlike most JFK files these had never been digitized. Major claims (FBI/CIA conspiracy, Ray framed): no primary-document support reported.", "tags": "MLK NARA FBI declassified", "status": "verified", "date": "2025-07-21"}, {"id": "mockingbird-record", "title": "What the Church Committee Found on CIA & the Media", "topic": "The Deep State, On the Record", "tid": "intel-abuses", "summary": "Church Committee Final Report, Book I (Apr 26, 1976): the CIA maintained covert relationships with ~50 American journalists/media figures; a network of several hundred foreign media individuals/assets for covert propaganda; 12+ U.S. news organizations provided cover for CIA officers abroad (some unwitting). The CIA refused to name names. Carl Bernstein (Rolling Stone, Oct 1977) separately reported ~400 U.S. journalists had worked with the CIA over 25 years.", "tags": "Mockingbird CIA media", "status": "verified", "date": "1976-04-26"}, {"id": "nist-wtc-reports", "title": "NIST World Trade Center Reports (NCSTAR 1 & 1A)", "topic": "9/11: The Documents", "tid": "sept11", "summary": "Federal Building and Fire Safety Investigation of the World Trade Center Disaster. Concludes each tower collapsed from aircraft impact damage, dislodged fireproofing and multi-floor fires — floor trusses sagged, pulled exterior columns inward, progressive collapse. WTC 7 (NCSTAR 1A, Nov 2008): thermal expansion failed Column 79 — 'the first known instance of the total collapse of a tall building primarily due to fires.' NIST's FAQ directly rebuts controlled demolition/thermite: no blast evidence; a thermite operation would have needed many thousands of pounds placed inconspicuously.", "tags": "9/11 WTC engineering", "status": "verified", "date": "2005-09-01"}, {"id": "pentagon-papers", "title": "The Pentagon Papers: NARA Full Release (2011)", "topic": "Vietnam-Era Files", "tid": "vietnam-war", "summary": "'Report of the Office of the Secretary of Defense Vietnam Task Force,' commissioned by McNamara in 1967, leaked by Daniel Ellsberg in June 1971. Full official release June 13, 2011 (40th anniversary) by NARA with the Kennedy, Johnson and Nixon libraries — ~7,000 pages in 48 boxes, no redactions, ~2,384 pages newly available vs. the Gravel edition.", "tags": "Vietnam Pentagon Papers NARA", "status": "verified", "date": "2011-06-13"}, {"id": "rfk-files-2025", "title": "RFK Assassination Files: 2025 Releases", "topic": "RFK & MLK Files", "tid": "rfk-mlk", "summary": "Under EO 14176 (signed Jan 23, 2025), RFK assassination files were released in tranches April–June 2025 (FBI/CIA/LAPD-related records). No verified primary-document support for the major conspiracy claims (second gunman, CIA involvement) has been reported from these releases.", "tags": "RFK NARA declassified", "status": "verified", "date": "2025-06-01"}, {"id": "rothschild-history", "title": "Rothschild Family: The Documented History", "topic": "Rothschild & Morgan", "tid": "bankers", "summary": "From Frankfurt's Judengasse: Mayer Amschel Rothschild (1744–1812) founded 'M A Rothschild und Söhne' in 1810; five sons built a Europe-wide network underwriting sovereign debt and financing governments including Britain's Napoleonic war effort. Today Rothschild & Co is an advisory/wealth-management firm. It owns no central banks.", "tags": "Rothschild banking", "status": "verified", "date": "1810-01-01"}, {"id": "senate-wmd-report", "title": "Senate Report: Prewar Iraq WMD Intelligence (2004)", "topic": "Bush-Era Files", "tid": "bush-era", "summary": "Unanimous bipartisan S. Rept. 108-301: most key judgments in the Oct 2002 NIE on Iraq were overstated or unsupported; 'group think' presumed active WMD programs; no CIA sources inside Iraq on WMD after 1998. Did NOT find analysts changed judgments from political pressure. Phase II (2008): administration public statements (Iraq–al-Qaeda partnership, WMD claims) were NOT substantiated by available intelligence.", "tags": "Bush Iraq WMD", "status": "verified", "date": "2004-07-09"}, {"id": "snowden-archives", "title": "Snowden Disclosures: The Public Archives", "topic": "Mass Surveillance Files", "tid": "surveillance", "summary": "Publicly documented collections of the 2013+ NSA disclosures: the ACLU NSA Documents Database (launched April 2014 — every document public since June 5, 2013, searchable); EFF's 'NSA Primary Sources' chronological list; The Guardian's 'The NSA Files'; National Security Archive holdings. (The exact current URL of the ACLU database was not captured in this research pass.)", "tags": "Snowden NSA surveillance", "status": "verified", "date": "2014-04-05"}, {"id": "tonkin-nsa", "title": "NSA 2005 Release: The Gulf of Tonkin Deception", "topic": "Vietnam-Era Files", "tid": "vietnam-war", "summary": "On Dec 1, 2005 NSA declassified 140+ formerly top-secret documents including historian Robert J. Hanyok's SIGINT study. Conclusion: the Aug 2, 1964 engagement (USS Maddox) was real; the Aug 4, 1964 second attack did NOT happen — it rested on bad naval intelligence and misrepresented SIGINT. The Aug 4 incident was the basis for the Gulf of Tonkin Resolution (Aug 7, 1964) authorizing the war.", "tags": "Vietnam NSA Gulf of Tonkin", "status": "verified", "date": "2005-12-01"}, {"id": "torture-memos", "title": "The OLC 'Torture Memos' (2002)", "topic": "Bush-Era Files", "tid": "bush-era", "summary": "OLC memos signed by Jay Bybee (drafted principally by John Yoo): narrowed 'torture' to pain equivalent to organ failure or death, and approved CIA 'enhanced' techniques for Abu Zubaydah. Withdrawn in 2004 by OLC head Jack Goldsmith as deeply flawed; rescinded by Obama Jan 22, 2009. DOJ OPR (2010) found professional misconduct; overruled to 'poor judgment.' No prosecutions resulted.", "tags": "Bush torture CIA", "status": "verified", "date": "2002-08-01"}, {"id": "tuskegee-records", "title": "Tuskegee Syphilis Experiment: The Records", "topic": "The Deep State, On the Record", "tid": "intel-abuses", "summary": "USPHS study in Macon County, Alabama (1932–1972): 399 Black men with syphilis observed without treatment; penicillin withheld after 1947; exposed by AP in 1972 (Peter Buxtun leak); terminated the same year. Class action Pollard v. United States settled 1974 (~$10M + lifetime medical benefits). President Clinton's formal apology, May 16, 1997, White House ceremony.", "tags": "Tuskegee medical abuse", "status": "verified", "date": "1997-05-16"}, {"id": "watch-kennedy-library-archives-kennedy-family-collection-now-digit", "title": "Kennedy Library Archives - Kennedy Family Collection Now Digitized", "topic": "The JFK Files", "tid": "jfk", "summary": "New release spotted by the source watcher (https://www.archives.gov/news). Matched keywords: jfk. Awaiting editorial review — summary to be written from the primary source.", "tags": "watcher jfk", "status": "verified", "date": "2025-05-29"}, {"id": "watch-rfk-files-uap-records-and-more", "title": "RFK Files, UAP Records, and More", "topic": "RFK & MLK Files", "tid": "rfk-mlk", "summary": "New release spotted by the source watcher (https://www.archives.gov/news). Matched keywords: rfk. Awaiting editorial review — summary to be written from the primary source.", "tags": "watcher rfk", "status": "verified", "date": "2025-04-01"}, {"id": "watch-task-force-on-the-declassification-of-federal-secrets", "title": "Task Force on the Declassification of Federal Secrets", "topic": "The JFK Files", "tid": "jfk", "summary": "New release spotted by the source watcher (https://oversight.house.gov/release). Matched keywords: declassif. Awaiting editorial review — summary to be written from the primary source.", "tags": "watcher declassif", "status": "verified", "date": "2026-10-08"}, {"id": "watergate-tapes", "title": "The 'Smoking Gun' Tape (June 23, 1972)", "topic": "Watergate", "tid": "watergate", "summary": "Oval Office conversation, Nixon–Haldeman, June 23, 1972, released Aug 5, 1974: Nixon and Haldeman plan to have the CIA tell the FBI to halt the Watergate investigation on false 'national security' grounds. It proved Nixon knew of the White House link to the burglaries within days and approved obstructing the FBI; congressional support collapsed; Nixon resigned Aug 8, 1974. Full tape portal at the Nixon Library.", "tags": "Watergate Nixon", "status": "verified", "date": "1974-08-05"}];
function go(q){q=q.toLowerCase().trim();const box=document.getElementById('results');
if(q.length<2){box.innerHTML='<p style="color:var(--dim)">Type at least 2 characters.</p>';return}
const hit=IDX.filter(r=>(r.title+' '+r.summary+' '+r.tags+' '+r.topic).toLowerCase().includes(q)).slice(0,40);
box.innerHTML=hit.length?hit.map(r=>`<div class="fileitem"><div class="meta">${r.date} · ${r.topic.toUpperCase()}</div><h3><a href="/doc/${r.id}/">${r.title}</a></h3><p>${r.summary.slice(0,180)}…</p></div>`).join(''):'<p style="color:var(--dim)">No files match.</p>'}
document.getElementById('q').addEventListener('input',e=>go(e.target.value));
const p=new URLSearchParams(location.search);if(p.get('q')){document.getElementById('q').value=p.get('q');go(p.get('q'))}
